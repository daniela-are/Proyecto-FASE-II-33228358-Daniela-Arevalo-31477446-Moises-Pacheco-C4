<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administrador — BinaryShop</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header class="vendedor-header">
    <div class="container vendedor-header-content">
      <a class="brand" href="../index.html">BinaryShop</a>
      <nav>
        <a href="../index.html" class="btn btn-secondary">Volver a la tienda</a>
        <button id="btn-cerrar-sesion" class="btn btn-outline">Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <main class="vendedor-main">
    <div class="container">
      <section class="vendedor-card">
        <div class="vendedor-avatar admin-avatar" id="admin-avatar">A</div>
        <div>
          <h1 id="admin-nombre">Administrador</h1>
          <span class="role-badge role-administrador">Administrador</span>
          <p class="profile-nickname" id="admin-nickname">@admin</p>
        </div>
      </section>

      <nav class="vendedor-tabs">
        <button class="vendedor-tab activa" data-tab="resumen">Resumen</button>
        <button class="vendedor-tab" data-tab="usuarios">Usuarios</button>
        <button class="vendedor-tab" data-tab="productos">Productos publicados</button>
      </nav>

      <!-- Pestaña 1: Resumen -->
      <section class="vendedor-panel activa" id="panel-resumen">
        <div id="admin-metricas" class="admin-metricas"></div>
      </section>

      <!-- Pestaña 2: Usuarios -->
      <section class="vendedor-panel" id="panel-usuarios">
        <div class="admin-filtro">
          <label for="admin-filtro-rol">Filtrar por rol:</label>
          <select id="admin-filtro-rol">
            <option value="todos">Todos</option>
            <option value="comprador">Compradores</option>
            <option value="vendedor">Vendedores</option>
            <option value="administrador">Administradores</option>
          </select>
        </div>
        <div id="admin-usuarios-lista" class="admin-lista"></div>
      </section>

      <!-- Pestaña 3: Productos publicados -->
      <section class="vendedor-panel" id="panel-productos">
        <div id="admin-productos-lista" class="admin-lista"></div>
      </section>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="../js/data/productos.js"></script>
  <script src="../js/data/usuarios.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/publicaciones.js"></script>
  <script src="../js/administrador.js"></script>
</body>
</html>
